android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m
org.gradle.daemon=false
# Tulkki: 4 threads with the Kotlin daemon, R8 and AAPT2 workers thrash at 4 workers.
org.gradle.workers.max=3
# AGP 9 supports it and Gradle has been printing the hint on every build.
org.gradle.configuration-cache=true
# The shared build cache, so a fresh lane or a verification copy reuses task
# outputs instead of recompiling them (measured: 91 of 151 tasks from cache).
org.gradle.caching=true
android.experimental.enableScreenshotTest=true
